# dsh bundle patch: plot-tools 插件入口。
#
# 安装方式（二选一）：
#   A. `dsh plugin --profile <name> add <本包路径>`（自动接线到该 profile 的 package.json）
#   B. 手工 flat fallback：把本包复制到 $DSH_HOME/profiles/node_modules/dsh-plot-tools/，
#      再在 $DSH_HOME/cordis.patch.yml 追加（先 disabled: true 灰度，冒烟通过再去掉）：
#        - insert:
#            - id: plot-tools
#              name: 'dsh-plot-tools'
#              disabled: true
#
# 业务层依赖：plot_plugin.py + plotcore/ + diagram/（包内自包含）；
# Python 依赖：matplotlib seaborn pandas numpy openpyxl（+ 可选 drawio CLI 用于 PNG 导出）；
# CJK 字体：$PLOT_FONT 或系统字体（见 plotcore/env.py，开源版不内置专有字体）。
- insert:
    - id: plot-tools
      name: 'dsh-plot-tools'
      disabled: true
